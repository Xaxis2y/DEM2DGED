[pytest]
# pytest configuration for dem2dged

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    unit: unit tests (fast, no external dependencies)
    integration: integration tests (may require GDAL, templates)
    slow: slow tests (e.g., full conversion pipeline)

# Output options
addopts =
    --strict-markers
    -ra

# Minimum Python version
minversion = 3.10
